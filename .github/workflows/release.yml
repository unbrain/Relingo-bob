name: Release Bob Plugin

on:
  workflow_dispatch:
    inputs:
      desc:
        description: "Release description"
        required: false
        default: "v0.0.4: 优化设置项布局（邮箱/验证码紧贴验证按钮）、支持繁体中文词典、短英文误判语种兜底与验证码 60s 重发"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build package and update appcast.json
        id: build
        run: |
          VERSION="$(python3 -c 'import json; print(json.load(open("src/info.json"))["version"])')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ./scripts/build.sh "${{ inputs.desc }}"

      - name: Commit updated appcast.json
        run: |
          if ! git diff --quiet appcast.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add appcast.json
            git commit -m "chore: update appcast.json for v${{ steps.build.outputs.version }}"
            git push origin HEAD:main
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.build.outputs.version }}
          name: v${{ steps.build.outputs.version }}
          body: |
            ### 更新内容 (v${{ steps.build.outputs.version }})

            - **设置面板交互优化**：
              - 将「登录方式 / Token / 密码 / 邮箱 / 邮箱验证码」移至设置面板底部，紧贴 Bob 的「验证」按钮，无需来回滚动即可完成输入与验证。
              - 验证码等待状态下超过 60 秒未填码再次点击「验证」可自动重发验证码，60 秒内提示剩余等待秒数。
            - **查词与语种优化**：
              - 繁体中文（`zh-Hant`）映射为 Relingo 原生支持的 `zh_TW`，直接返回繁体释义与繁体变体标签。
              - 当源语言为 `auto` 且 Bob 将短英文单词（如 `menu`、`status`）误判为法/德/西语时，仍优先尝试 Relingo 英文查词，未收录再回落句子翻译。
              - MyMemory 兜底源语言识别兼容粤语/文言文及中文字符检测。
          files: release/relingo_bob${{ steps.build.outputs.version }}.bobplugin
          make_latest: true
