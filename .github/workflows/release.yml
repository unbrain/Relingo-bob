name: Release Bob Plugin

on:
  workflow_dispatch:
    inputs:
      desc:
        description: "Release description"
        required: false
        default: "v0.0.3: 优化大小写/标点查词、空词条回落、JWT Token 签名校验、词性缩写、Gemini/推理模型兼容与长文本分片"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build package and update appcast.json
        id: build
        run: |
          VERSION="$(python3 -c 'import json; print(json.load(open("src/info.json"))["version"])')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ./scripts/build.sh "${{ inputs.desc }}"

      - name: Commit updated appcast.json
        run: |
          if ! git diff --quiet appcast.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add appcast.json
            git commit -m "chore: update appcast.json for v${{ steps.build.outputs.version }}"
            git push origin HEAD:main
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.build.outputs.version }}
          name: v${{ steps.build.outputs.version }}
          body: |
            ### 更新内容 (v${{ steps.build.outputs.version }})

            - **查词体验优化**：
              - 支持首字母大写/全大写单词（如 `Vocabulary`、`Apple`、`USA`）与带标点选词（如 `"vocabulary."`）自动匹配 Relingo 词库。
              - 词性标签规范化为 `n.` / `v.` / `adj.` / `adv.` 等标准缩写，英英释义限制长度避免弹窗溢出。
              - 无中文释义且无英英释义的空词条（如部分专有名词）自动回落到句子翻译。
            - **认证与状态优化**：
              - 修复 JWT Token 前缀相同导致更换 Token 不触发刷新的问题（改用长度 + FNV-1a 哈希签名）。
              - Token 直连模式支持首次翻译自动同步登录态；切换为「仅查词（免登录）」立即生效。
              - 选择「自定义 OpenAI 兼容 LLM」时在「验证」阶段校验地址与 Key。
            - **兜底与兼容性优化**：
              - 自定义 LLM 地址兼容 `/openai`、`/v1beta` 等路径，并自动过滤推理模型 `<think>` 标签。
              - MyMemory 长文本按句号/空格边界智能分片，避免超 500 字符限制。
              - `cip.cc` 异常返回 HTML 时自动跳过。
          files: release/relingo_bob${{ steps.build.outputs.version }}.bobplugin
          make_latest: true
